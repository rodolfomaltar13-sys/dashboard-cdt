<head>

<style>
  :root{
    --dark-green:#007A5A;
    --med-green:#00A078;
    --light-green:#E6F9F3;
    --gold:#C8972B;
    --red:#C0392B;
    --text-main:#173A31;
    --text-sub:#5C6B66;
    --text-mute:#7C8B86;
    --border:#E3ECE8;
    --bg:#F5FAF8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif;
    background:var(--bg);
    color:var(--text-main);
  }
  .header{

    padding:26px 28px 60px;
    position:relative;
    overflow:hidden;
  }
  .header .blob1{position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,0.06);}
  .header .blob2{position:absolute;right:80px;bottom:-80px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.05);}
  .header-inner{position:relative;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;}
  .header-eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .header-icon{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;}
  .header-eyebrow span{color:rgba(255,255,255,0.75);font-size:12px;font-weight:700;letter-spacing:1px;}
  .header h1{color:#fff;font-size:26px;font-weight:900;margin:0;letter-spacing:-0.3px;}
  .header p{color:rgba(255,255,255,0.7);font-size:13px;margin-top:4px;font-weight:600;}
  .meta-badge{background:rgba(255,255,255,0.1);border-radius:14px;padding:12px 18px;color:#fff;}
  .meta-badge .label{font-size:11px;opacity:0.75;font-weight:700;margin-bottom:2px;}
  .meta-badge .value{font-size:22px;font-weight:900;}

  .nav-wrap{max-width:1200px;margin:-24px auto 0;padding:0 20px;position:relative;z-index:5;}
  .nav{background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(0,50,35,0.12);padding:8px;display:flex;gap:4px;flex-wrap:wrap;}
  .nav button{flex:1 1 auto;padding:11px 14px;border-radius:11px;border:none;cursor:pointer;font-size:13px;font-weight:800;transition:all .15s;background:transparent;color:var(--text-sub);font-family:inherit;}
  .nav button.active{background:var(--dark-green);color:#fff;}

  .container{max-width:1200px;margin:0 auto;padding:24px 20px 60px;}

  .alert{display:flex;gap:10px;align-items:flex-start;background:#FBF6EA;border:1px solid rgba(200,151,43,0.33);border-radius:12px;padding:12px 16px;margin-bottom:22px;}
  .alert svg{margin-top:2px;flex-shrink:0;}
  .alert div{font-size:12.5px;color:#6B5A2A;line-height:1.5;}

  .kpi-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .kpi{background:#fff;border-radius:16px;border:1px solid var(--border);padding:18px 20px;flex:1;min-width:200px;box-shadow:0 1px 3px rgba(0,50,35,0.05);}
  .kpi-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .kpi-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .kpi-label{font-size:12px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:0.3px;}
  .kpi-value{font-size:28px;font-weight:900;color:var(--text-main);line-height:1;}
  .kpi-sub{font-size:12px;color:var(--text-mute);margin-top:6px;font-weight:600;}

  .flex-row{display:flex;gap:16px;flex-wrap:wrap;}
  .card{background:#fff;border-radius:16px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,50,35,0.05);}

  .gauge-card{padding:24px;display:flex;align-items:center;gap:24px;flex:1 1 340px;}
  .gauge-title{font-size:13px;font-weight:800;color:var(--text-main);margin-bottom:6px;}
  .gauge-desc{font-size:12px;color:var(--text-mute);line-height:1.6;}

  .alerts-card{padding:22px;flex:1 1 340px;}
  .alerts-title{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13.5px;font-weight:800;color:var(--text-main);}
  .alert-row{display:flex;justify-content:space-between;align-items:center;background:#FBEAE8;border-radius:10px;padding:9px 12px;margin-bottom:8px;}
  .alert-row span:first-child{font-size:12.5px;font-weight:700;color:var(--text-main);}
  .alert-row span:last-child{font-size:11px;font-weight:800;color:var(--red);}
  .no-alert{font-size:12.5px;color:var(--text-mute);}

  .refut-card{padding:22px;margin-top:16px;}
  .refut-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .refut-title{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--text-main);}
  .refut-score{font-size:13px;font-weight:900;}
  .refut-bar{height:10px;background:#EDF2F0;border-radius:999px;overflow:hidden;margin-bottom:18px;}
  .refut-bar-fill{height:100%;border-radius:999px;}
  .refut-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(200px,1fr));gap:10px;}
  .refut-item{display:flex;justify-content:space-between;align-items:center;background:var(--light-green);border-radius:10px;padding:8px 12px;}
  .refut-item.outros{background:#F2F5F3;}
  .refut-name{font-size:12px;font-weight:700;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .refut-name.outros{color:var(--text-mute);}
  .refut-count{font-size:13px;font-weight:900;color:var(--dark-green);}
  .refut-count.outros{color:var(--text-mute);}
  .refut-min-section{margin-top:18px;padding-top:16px;border-top:1px dashed var(--border);}
  .refut-min-title{font-size:12.5px;font-weight:800;color:var(--text-main);margin-bottom:10px;}
  .refut-table{width:100%;border-collapse:collapse;min-width:480px;}
  .refut-table thead tr{border-bottom:2px solid var(--light-green);}
  .refut-table th{text-align:left;padding:8px;font-size:10.5px;color:var(--text-mute);font-weight:800;}
  .refut-table th.center{text-align:center;}
  .refut-table td{padding:9px 8px;font-size:12px;color:var(--text-main);}
  .refut-table td.center{text-align:center;}
  .refut-table tbody tr{border-bottom:1px solid #F0F4F2;}
  .refut-pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;}
  .refut-pill.ok{background:var(--light-green);color:var(--dark-green);}
  .refut-pill.no{background:#FBEAE8;color:var(--red);}

  .quinzena-toggle{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
  .quinzena-toggle button{padding:8px 16px;border-radius:999px;border:1.5px solid var(--border);background:#fff;color:var(--text-sub);font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;}
  .quinzena-toggle button.active{border-color:var(--dark-green);background:var(--dark-green);color:#fff;}
  .quinzena-info{margin-left:auto;font-size:12px;color:var(--text-mute);font-weight:700;}

  .seller-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(280px,1fr));gap:16px;}
  .seller-card{padding:18px 20px;display:flex;flex-direction:column;gap:12px;}
  .seller-head{display:flex;align-items:center;gap:12px;}
  .avatar{width:42px;height:42px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,var(--dark-green),var(--med-green));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  .avatar.small{width:34px;height:34px;font-size:12px;border-radius:10px;}
  .avatar.xsmall{width:32px;height:32px;font-size:11px;border-radius:9px;}
  .seller-name{font-weight:800;font-size:14.5px;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .seller-sub{font-size:11px;color:var(--text-mute);margin-top:1px;}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.2px;white-space:nowrap;}

  .badge.no{background:#FBEAE8;color:var(--red);border:1px solid rgba(192,57,43,0.2);}

  .stat-box .lbl{font-size:10px;color:var(--text-sub);font-weight:700;margin-top:2px;}

  .mini-bar-label{font-size:11.5px;color:var(--text-sub);display:flex;align-items:center;gap:5px;font-weight:600;}
  .mini-bar-value{font-size:12.5px;font-weight:800;}
  .mini-bar-track{height:6px;background:#EDF2F0;border-radius:999px;overflow:hidden;position:relative;}
  .mini-bar-fill{height:100%;border-radius:999px;transition:width .4s;}

  .cashback-row{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px dashed var(--border);}
  .cashback-left{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-sub);font-weight:600;}

  .bonus-header{padding:16px 20px;margin-bottom:18px;display:flex;align-items:center;gap:12px;}
  .bonus-header-title{font-weight:800;font-size:14px;color:var(--text-main);}
  .bonus-header-sub{font-size:12px;color:var(--text-mute);}
  .bonus-item{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .bonus-rank{width:22px;font-size:13px;font-weight:900;text-align:center;}
  .bonus-track-card{flex:1;padding:14px 18px;}
  .bonus-track-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .bonus-track-left{display:flex;align-items:center;gap:10px;}
  .bonus-track-name{font-weight:800;font-size:13.5px;color:var(--text-main);}
  .bonus-track-sub{font-size:11px;color:var(--text-mute);}

  .bonus-remaining{font-size:11.5px;font-weight:700;color:var(--text-mute);}
  .bonus-track-bar{position:relative;height:14px;background:#EDF2F0;border-radius:999px;}
  .bonus-track-fill{height:100%;border-radius:999px;transition:width .5s ease;}
  .bonus-flag{position:absolute;right:-2px;top:-3px;}

  table{width:100%;border-collapse:collapse;min-width:900px;}
  th{text-align:left;padding:10px 8px;font-size:11px;color:var(--text-mute);font-weight:800;}
  th.center, td.center{text-align:center;}
  td{padding:11px 8px;font-size:12.5px;color:var(--text-main);}
  thead tr{border-bottom:2px solid var(--light-green);}
  tbody tr{border-bottom:1px solid #F0F4F2;}
  tfoot tr{border-top:2px solid var(--light-green);}
  .delta{display:inline-flex;align-items:center;gap:2px;font-weight:800;font-size:11.5px;}
  .table-wrap{padding:20px;overflow-x:auto;}

  .pending-note{font-size:12px;color:var(--text-mute);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
  .accordion{margin-bottom:10px;overflow:hidden;}
  .accordion-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:none;border:none;cursor:pointer;text-align:left;font-family:inherit;}
  .accordion-left{display:flex;align-items:center;gap:10px;}
  .accordion-name{font-weight:800;font-size:13.5px;color:var(--text-main);}
  .accordion-right{display:flex;align-items:center;gap:12px;}
  .count-pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;}
  .count-pill.red{color:var(--red);background:#FBEAE8;}
  .count-pill.yellow{color:var(--gold);background:#FBF6EA;}
  .chevron{transition:transform .2s;}
  .chevron.open{transform:rotate(180deg);}
  .accordion-body{padding:0 18px 16px;display:none;}
  .accordion-body.open{display:block;}
  .pending-grid-head{display:grid;grid-template-columns:1.6fr 1fr 1fr 0.9fr 0.7fr;gap:10px;padding:0 14px 6px;font-size:10.5px;font-weight:800;color:var(--text-mute);text-transform:uppercase;}
  .pending-row{display:grid;grid-template-columns:1.6fr 1fr 1fr 0.9fr 0.7fr;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;margin-bottom:6px;font-size:12.5px;}
  .pending-name{font-weight:700;color:var(--text-main);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pending-cell{color:var(--text-sub);display:flex;align-items:center;gap:5px;}
  .pending-type{font-weight:800;}
  .pending-qyc{color:var(--text-sub);font-weight:700;}
  .all-clear{font-size:11px;color:var(--text-mute);font-weight:700;}

  svg{display:block;}
  @media (max-width:640px){
    .header{padding:22px 16px 54px;}
    .container{padding:20px 12px 50px;}
    .nav-wrap{padding:0 12px;}
    table{min-width:760px;}
  }
</style>
</head>

}

function miniBar(label, value, target, icon){
  const ok = value >= target;
  const color = ok ? C.medGreen : value >= target*0.7 ? C.gold : C.red;
  return `
  <div class="mini-bar">
    <div class="mini-bar-top">
      <span class="mini-bar-label" style="color:${color === C.red ? '#4B5D58' : '#4B5D58'}">${icon} ${label}</span>
      <span class="mini-bar-value" style="color:${color}">${value.toFixed(1)}%</span>
    </div>
    <div class="mini-bar-track">
      <div class="mini-bar-fill" style="width:${Math.min(value,100)}%;background:${color}"></div>
    </div>
  </div>`;
}

function kpiHtml(icon, label, value, sub, accent){
  return `
  <div class="card kpi">
    <div class="kpi-top">
      <div class="kpi-icon" style="background:${accent}1A;color:${accent}">${icon}</div>
      <span class="kpi-label">${label}</span>
    </div>
    <div class="kpi-value">${value}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ""}
  </div>`;
}

function gaugeRingHtml(percent, size=132){
  const stroke = 13;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const clamped = Math.min(percent, 100);
  const color = percent >= 100 ? C.medGreen : percent >= 60 ? C.darkGreen : C.gold;
  const offset = c - (clamped/100)*c;
  return `
  <div style="position:relative;width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#EDF2F0" stroke-width="${stroke}" fill="none"></circle>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"
        style="transition:stroke-dashoffset .6s ease"></circle>
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div style="font-size:24px;font-weight:900;color:#173A31">${percent}%</div>
      <div style="font-size:10px;color:#7C8B86;font-weight:700">DA META</div>
    </div>
  </div>`;
}

function deltaTagHtml(curr, prev){
  const diff = curr - prev;
  if(prev===0 && curr===0) return `<span style="color:#B0BBB7;font-size:11px">—</span>`;
  const up = diff>0, flat = diff===0;
  const color = flat ? "#7C8B86" : up ? C.medGreen : C.red;
  const icon = flat ? ICONS.minus : up ? ICONS.trendDown.replace('polyline points="23 18 13.5 8.5 8.5 13.5 1 6"','polyline points="1 6 8.5 13.5 13.5 8.5 23 18"').replace('polyline points="17 18 23 18 23 12"','polyline points="17 6 23 6 23 12"') : ICONS.trendDown;
  return `<span class="delta" style="color:${color}">${icon} ${diff>0?"+":""}${diff}</span>`;
}

              <td class="center">${noQ1 ? `<span style="color:#B0BBB7;font-size:11px">novo(a)</span>` : deltaTagHtml(s.q2.vendas, s.q1.vendas)}</td>
              <td class="center" style="color:#4B5D58;font-size:12px">${noQ1?"—":s.q1.app_pct+"%"} ${ICONS.arrow} ${s.q2.app_pct}%</td>
              <td class="center" style="color:#4B5D58;font-size:12px">${noQ1?"—":s.q1.pl_pct+"%"} ${ICONS.arrow} ${s.q2.pl_pct}%</td>
              <td class="center" style="color:#4B5D58;font-size:12px">${noQ1?"—":s.q1.qyc_pct+"%"} ${ICONS.arrow} ${s.q2.qyc_pct}%</td>

function pendingRowHtml(c){
  const prioColor = c.prioridade===1 ? C.red : C.gold;
  const prioBg = c.prioridade===1 ? "#FBEAE8" : "#FBF6EA";
  const dot = c.prioridade===1 ? "🔴" : c.pendente==="APP" ? "🟡" : "🟨";
  return `
  <div class="pending-row" style="background:${prioBg}">
    <div class="pending-name"><span>${dot}</span> ${esc(c.nome)}</div>
    <div class="pending-cell">${ICONS.cal} ${c.data}</div>
    <div class="pending-cell">${ICONS.phone} ${c.telefone || "—"}</div>
    <div class="pending-type" style="color:${prioColor}">${c.pendente}</div>
    <div class="pending-qyc">QYC ${c.qyc_pct}%</div>
  </div>`;
}

function renderPendente(){
  const el = document.getElementById("tab-pendente");
  const q = state.quinzenaPend;
  el.innerHTML = `
    <div class="quinzena-toggle">
      <button data-q="q1" class="${q==='q1'?'active':''}">1ª Quinzena</button>
      <button data-q="q2" class="${q==='q2'?'active':''}">2ª Quinzena (atual)</button>
    </div>
    <div class="pending-note">${ICONS.phoneCall} Clientes com APP e/ou PL pendente, priorize 🔴 (ambos) antes de 🟡 (APP) e 🟨 (PL)</div>
    <div id="pendente-list"></div>
  `;
  el.querySelectorAll(".quinzena-toggle button").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.quinzenaPend = btn.dataset.q; renderPendente(); });
  });

  const list = document.getElementById("pendente-list");
  list.innerHTML = DATA.sellers.map(s=>{
    const items = q === "q1" ? s.pendentes_q1 : s.pendentes_q2;
    const sorted = [...items].sort((a,b)=>a.prioridade-b.prioridade);
    const countRed = items.filter(c=>c.prioridade===1).length;
    const countYellow = items.length - countRed;
    const uid = "acc-"+s.id.replace(/[^A-Z]/gi,"");
    return `
    <div class="card accordion">
      <button class="accordion-head" data-target="${uid}">
        <div class="accordion-left">
          <div class="avatar xsmall">${initials(s.nome)}</div>
          <span class="accordion-name">${esc(s.nome)}</span>
        </div>
        <div class="accordion-right">
          ${countRed>0 ? `<span class="count-pill red">🔴 ${countRed}</span>` : ""}
          ${countYellow>0 ? `<span class="count-pill yellow">🟡 ${countYellow}</span>` : ""}
          ${items.length===0 ? `<span class="all-clear">Tudo em dia</span>` : ""}
          <span class="chevron" id="chev-${uid}">${ICONS.chevron}</span>
        </div>
      </button>
      <div class="accordion-body" id="${uid}">
        ${items.length>0 ? `
          <div class="pending-grid-head"><span>Cliente</span><span>Data</span><span>Telefone</span><span>Pendente</span><span>QYC</span></div>
          ${sorted.map(pendingRowHtml).join("")}
        ` : ""}
      </div>
    </div>`;
  }).join("");

  list.querySelectorAll(".accordion-head").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const target = document.getElementById(btn.dataset.target);
      const chev = document.getElementById("chev-"+btn.dataset.target);
      target.classList.toggle("open");
      chev.classList.toggle("open");
    });
  });
}

function renderAll(){
  renderNav();

  document.getElementById("tab-comparativo").style.display = state.tab==="comparativo" ? "block" : "none";

  if(state.tab==="geral") renderGeral();
  if(state.tab==="vendedores") renderVendedores();
  if(state.tab==="bonificacao") renderBonificacao();
  if(state.tab==="comparativo") renderComparativo();
  if(state.tab==="pendente") renderPendente();
}

document.getElementById("metaUnidade").textContent = DATA.meta_unidade;
bindNav();
renderAll();
